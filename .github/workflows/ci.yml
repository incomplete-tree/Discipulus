name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux and Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libx11-dev libxcomposite-dev libxdamage-dev \
            libxfixes-dev libxrandr-dev liblzma-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.31.6'

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Write Gradle local.properties
        shell: bash
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          test -n "${FLUTTER_ROOT:-}"
          {
            printf 'sdk.dir=%s\n' "$android_sdk"
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
          } > android/local.properties

      - name: Compile phone and Wear release variants
        working-directory: android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon
