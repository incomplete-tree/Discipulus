name: Wear OS Test Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.2.2)'
        required: true
      build_number:
        description: 'Build number (e.g., 1)'
        required: true

env:
  APP_NAME: discipulus

jobs:
  build-wear:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build debug Wear OS APK
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          curl --fail --location --retry 3 --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.14.3-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" -p android :wear:assembleDebug \
            -PversionName=${{ inputs.version }} -PversionCode=${{ inputs.build_number }}
          mkdir -p build/wearos
          cp android/wear/build/outputs/apk/debug/wear-debug.apk \
            build/wearos/${{ env.APP_NAME }}_wearos-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wearos-build
          path: build/wearos/${{ env.APP_NAME }}_wearos-debug.apk

  publish-wear-release:
    name: Publish Wear OS Test Release
    needs: build-wear
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wearos-build
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Wear OS test ${{ inputs.version }} (Build ${{ inputs.build_number }})
          files: artifacts/discipulus_wearos-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
